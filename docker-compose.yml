version: "3.9"

services:
  #################################################
  # MongoDB
  #################################################
  mongodb:
    image: mongo:7
    container_name: mongodb-crm-ai

    restart: unless-stopped

    ports:
      - "${MONGO_PORT}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - crm-ai-network

  #################################################
  # Mongo Express
  #################################################
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-crm-ai

    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    ports:
      - "${MONGO_EXPRESS_PORT}:8081"

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017

      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

    networks:
      - crm-ai-network

  #################################################
  # Backend
  #################################################
  backend:
    build:
      context: ./crm-ai-backend
      dockerfile: Dockerfile

    container_name: backend-crm-ai

    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT}:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin

    volumes:
      - ./crm-ai-backend:/app
      - backend_node_modules:/app/node_modules

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - crm-ai-network

  #################################################
  # Frontend
  #################################################
  frontend:
    build:
      context: ./crm-ai-ui
      dockerfile: Dockerfile

    container_name: frontend-crm-ai

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT}:5173"

    env_file:
      - .env

    environment:
      VITE_API_URL: ${VITE_API_URL}

    volumes:
      - ./crm-ai-ui:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - crm-ai-network

#################################################
# Volumes
#################################################
volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:

#################################################
# Networks
#################################################
networks:
  crm-ai-network:
    driver: bridge